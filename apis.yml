aid: agriaku
name: AgriAku
description: 'AgriAku (PT Agriaku Digital Indonesia) is a Jakarta-based agritech company
  founded in 2021 that digitizes the distribution of agricultural inputs - seeds, fertilizers,
  crop protection, nutrients and farm tools - to Indonesia''s network of independent
  farm-supply shops (toko tani). Partner shops order from a catalog of more than 15,000
  agricultural products through the AgriAku Mitra Android app, while separate vendor,
  seller and courier applications cover the rest of the supply chain. The company reports
  more than 23,390 partners across Indonesia and has raised roughly USD 46M from Alpha
  JWC Ventures, Go-Ventures and MDI Ventures. AgriAku operates no public developer program:
  every API host it runs is a private backend for its own first-party mobile and web
  applications.'
